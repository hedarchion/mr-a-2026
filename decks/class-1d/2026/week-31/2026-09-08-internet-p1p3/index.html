#count {

  font-size: 24px;
}
#slide [hidden] {

}
@media (prefers-reduced-motion: reduce) {
  * {

    transition: none !important;
  }
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.list button:disabled {
  opacity: 1;
}

e":"cloze","prompt":"When was it developed?","sentence":"Developed in: {{blank}}.","options":["in the 1960s","in 1969"],"answer":"in the 1960s","feedback":"1969 is ARPANET. Developed means the 1960s."},{"id":"field-2","type":"cloze","prompt":"Name one Cold War country.","sentence":"First country: {{blank}}.","options":["the United States","the Soviet Union"],"answer":"the United States","feedback":"The key accepts either country. Write one here."},{"id":"field-3","type":"cloze","prompt":"Name the other Cold War country.","sentence":"Second country: {{blank}}.","options":["the Soviet Union","the United States"],"answer":"the Soviet Union","feedback":"Write the other country here."},{"id":"field-4","type":"cloze","prompt":"When did it link the world?","sentence":"Linked globally: {{blank}}.","options":["by the 1970s","in 1969"],"answer":"by the 1970s","feedback":"1969 is the first link. Global came later."},{"id":"field-5","type":"cloze","prompt":"Who invented the World Wide Web?","sentence":"Inventor: {{blank}}.","options":["Tim Berners-Lee","the US government"],"answer":"Tim Berners-Lee","feedback":"The government needed it. Berners-Lee invented it."},{"id":"field-6","type":"cloze","prompt":"Name one use of the Internet.","sentence":"Use number one: {{blank}}.","options":["chatting","gaming"],"answer":"chatting","feedback":"The key accepts chatting, shopping or gaming in any order."},{"id":"field-7","type":"cloze","prompt":"Name another use of the Internet.","sentence":"Use number two: {{blank}}.","options":["shopping","chatting"],"answer":"shopping","feedback":"Pick a different one from field 6."},{"id":"field-8","type":"cloze","prompt":"Name the last use of the Internet.","sentence":"Use number three: {{blank}}.","options":["gaming","shopping"],"answer":"gaming","feedback":"The last one left."},{"id":"book-table","type":"writing","prompt":"Your turn","task":"Complete the Module p33 table in your book. Lift three words or fewer from the text per field.","frame":"Field 1: in the 1960s. Fields 2 and 3: one country each."}]}</script><script>(() => {
  "use strict";
  const deck = JSON.parse(document.getElementById("deck-data").textContent),
    stage = document.getElementById("stage"),
    slide = document.getElementById("slide");
  const [w, h] = (deck.viewport || "1366x768").split("x").map(Number);
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  let index = 0;
  const states = deck.slides.map(() => ({
    hint: false,
    revealed: false,
    step: 0,
    selected: null,
    order: [],
    groups: {},
  }));
  const el = (tag, text, cls) => {

    if (text !== undefined) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  };

      ? "prompt-only"

    slide.dataset.type = s.type;
    slide.setAttribute("aria-label", s.prompt);
    slide.append(el("h1", s.prompt));
    const add = (tag, text, cls) => {
      const n = el(tag, text, cls);
      slide.append(n);
      return n;
    };
    if (s.type === "cloze") {
      const n = add("p", undefined, "hero");
      const [a, b] = s.sentence.split("{{blank}}");
      const blankText = st.revealed ? s.answer : st.selected || "_____";
      n.append(
        document.createTextNode(a),
        el("span", blankText, blankText === "_____" ? "blank empty" : "blank"),
        document.createTextNode(b),
      );
    }
    if (s.type === "gap") {
      const n = add("p", undefined, "passage");
      const [a, b] = s.text.split("{{blank}}");
      const blankText = st.revealed ? s.answer : st.selected || "_____";
      n.append(
        document.createTextNode(a),
        el("span", blankText, blankText === "_____" ? "blank empty" : "blank"),
        document.createTextNode(b),
      );
    }
    if (["choice", "cloze", "gap"].includes(s.type)) {
      const n = add("div", undefined, "choices");
      s.options.forEach((o) =>
        n.append(
          button(
            o,
            () => {
              st.selected = o;
              st.revealed = false;
              draw();
              focusChoice(o);
            },
            st.selected === o,
          ),
        ),
      );
    }
    if (s.type === "compare") {
      const n = add("div", undefined, "compare");
      s.columns.forEach((c) => {
        const col = el("div");
        col.append(el("p", c.label, "label"), el("p", c.text, "body"));
        n.append(col);
      });
    }
    if (s.type === "passage") add("p", s.text, "passage");
    if (s.type === "writing") {
      add("p", s.task, "body");
      if (st.revealed && s.frame) add("p", s.frame, "answer");
    }
    if (s.type === "image") {
      const n = add("img", undefined, "picture");
      n.src = s.src;
      n.alt = s.alt;
    }
    if (s.type === "steps") {
      const n = add("div", undefined, "list");
      s.items
        .slice(0, Math.max(1, st.step + 1))
        .forEach((t, i) => n.append(el("p", `${i + 1}. ${t}`, "step")));
    }

      const n = add("div", undefined, "list");
      const display = s.items.map((_, i) => i);
      if (!st.revealed) display.reverse();

        const pos = st.order.indexOf(i);

          button(

            () => {

        f.setAttribute("role", "status");

    rev.hidden = !(
      ["reveal", "choice", "cloze", "gap", "steps", "order", "sort"].includes(
        s.type,
      ) ||
      (s.type === "writing" && s.frame)
    );
    rev.textContent = s.type === "steps" ? "Next step" : "Reveal";
    rev.disabled =
      s.type === "steps" ? st.step >= s.items.length - 1 : st.revealed;
    document.getElementById("reset").hidden = hint.hidden && rev.hidden;
    document.getElementById("prev").disabled = index === 0;
    document.getElementById("next").disabled = index === deck.slides.length - 1;
    document.getElementById("count").textContent =

    if (focusIndex >= 0) slide.querySelectorAll("button")[focusIndex]?.focus();
    document.getElementById("announcement").textContent =
      `Slide ${index + 1} of ${deck.slides.length}. ${s.prompt}. ` +
      (st.revealed
        ? (s.answer || "") + " " + (s.feedback || "")
        : st.hint
          ? s.hint || ""
          : st.selected || "");
  }
  // Enlarge sparse content to use the classroom canvas. Never shrink below
  // the shared projection type scale; oversized content must be split in JSON.
  function expandContent(type) {
    if (type === "image") return;
    const fits = () => {
      const bounds = slide.getBoundingClientRect();
      const ratio = bounds.width / slide.offsetWidth;
      const style = getComputedStyle(slide);
      const top = bounds.top + parseFloat(style.paddingTop) * ratio;
      const bottom = bounds.bottom - parseFloat(style.paddingBottom) * ratio;
      const left = bounds.left + parseFloat(style.paddingLeft) * ratio;
      const right = bounds.right - parseFloat(style.paddingRight) * ratio;
      return [...slide.querySelectorAll("*")].every((node) => {
        const r = node.getBoundingClientRect();
        return (
          (!r.width && !r.height) ||
          (r.top >= top - 1 &&
            r.bottom <= bottom + 1 &&
            r.left >= left - 1 &&
            r.right <= right + 1 &&
            node.scrollWidth <= node.clientWidth + 1)
        );
      });

      high = type === "prompt" || type === "reveal" ? 1.4 : 1.25;

      const mid = (low + high) / 2;
      slide.style.setProperty("--text-expansion", mid);

    [...slide.querySelectorAll("button")]
      .find((n) => n.textContent === text)
      ?.focus();
  }

    const s = deck.slides[index],
      st = states[index];
    if (s.type === "steps") st.step = Math.min(st.step + 1, s.items.length - 1);

      st.revealed = true;
      st.hint = false;
      if (["choice", "cloze", "gap"].includes(s.type)) st.selected = s.answer;
      if (s.type === "sort")
        s.items.forEach((x, i) => (st.groups[i] = x.category));
      if (s.type === "order") st.order = s.items.map((_, i) => i);
    }
    draw();
  }
  function move(n) {
    index = Math.max(0, Math.min(deck.slides.length - 1, index + n));
    draw();
  }
  document.getElementById("hint").onclick = () => {
    states[index].hint = !states[index].hint;
    draw();
  };
  document.getElementById("reveal").onclick = reveal;
  document.getElementById("reset").onclick = () => {
    states[index] = {
      hint: false,
      revealed: false,
      step: 0,
      selected: null,
      order: [],
      groups: {},
    };
    draw();
  };

  document.getElementById("next").onclick = () => move(1);
