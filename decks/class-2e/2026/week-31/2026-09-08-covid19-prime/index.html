<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Small Words, Strong Sentences</title><style>:root {

* {

}
.question-label,
.instruction {
  font-size: calc(30px * var(--text-expansion));
  line-height: 1.15;
  color: var(--accent);
  margin: 0;
}
.question-label {
  margin-bottom: -12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
}
.instruction {
  max-width: 980px;
}
p {
  margin: 0;
}
button {

  color: inherit;
  cursor: pointer;
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 9px;
  padding: 10px 18px;
}
button:hover {
  border-color: var(--accent);
}
button:focus-visible {

}
button:disabled {

}
button[hidden] {

}
.hero {
  font-size: calc(68px * var(--text-expansion));
  line-height: 1.2;
  letter-spacing: -0.8px;
}
.body,
.answer {
  font-size: calc(48px * var(--text-expansion));
  line-height: 1.22;
}
.stimulus {
  font-size: 42px;
  line-height: 1.25;
  white-space: pre-line;

  padding-left: 24px;

}
.passage {
  font-size: calc(46px * var(--text-expansion));
  line-height: 1.3;

}

  color: var(--muted);
}

  flex-wrap: wrap;
}
.choices button {

  text-align: left;
  padding: 18px 25px;
}
.selected {

  background: var(--soft);
}
.choices button.correct,
.order-result.correct {

  background: var(--soft);
  font-weight: 700;
}
.choices button.incorrect,
.order-result.incorrect {

}
.order-result {
  padding: 16px 20px;
  border-radius: 9px;
}
.result-status {
  font-size: calc(36px * var(--text-expansion));
  line-height: 1.1;
  margin-bottom: 10px;
  font-weight: 700;
}
.result-sequence {
  font-size: calc(40px * var(--text-expansion));
  line-height: 1.18;
}
.feedback,
.hint {
  font-size: calc(36px * var(--text-expansion));
  line-height: 1.22;
  color: var(--accent);
}
.answer {
  color: var(--accent);
}
.blank {

  padding: 0 8px;

  white-space: nowrap;
}
.blank.empty {
  border-bottom-color: transparent;
}
/* Gap stories insert whole sentences, so the blank may wrap. Single-word
   cloze blanks keep nowrap above. */
.passage .blank {
  white-space: normal;
}
/* Gap slides stack a prompt, a 3-line story, and up to 3 sentence buttons
   above a 76px footer. Measured at 1280x665: default rhythm overflows by
   ~140px, so gap slides use tighter spacing. Type sizes for the story (46px)
   and options (44px) are untouched; only the repeated one-line prompt,
   padding, and gaps compact. Teacher-operated buttons, so 8px padding is

#slide[data-type="gap"] {
  padding: 16px 44px;
  gap: 10px;
}

}

}

}
.compare {

}
.label {

  color: var(--accent);
  margin-bottom: 18px;
}
.list {

  gap: 12px;
}
.list button,
.step {

  text-align: left;
  line-height: 1.16;
}
.sort-row {

  align-items: center;
  justify-content: space-between;
  gap: 22px;
  font-size: calc(44px * var(--text-expansion));
}
.sort-row button {

  padding: 12px 20px;
}
.sort-row .choices {

}

}

}

  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
}
.wordmix-row {

  grid-template-columns: 190px 1fr;
  align-items: center;
  gap: 12px;
  min-width: 0;
  font-size: calc(36px * var(--text-expansion));
  line-height: 1.1;
}
.wordmix-row button,
.wordmix-ideas button {

  font-weight: 700;
  padding: 8px 12px;
}
.wordmix-builder {

  grid-template-columns: 1fr auto;

}
.wordmix-ideas {

  gap: 8px;
}
.wordmix-selection {

  color: var(--accent);
  font-weight: 700;
}
.wordmix-frame {

  font-size: calc(36px * var(--text-expansion));
  line-height: 1.1;
}
#slide[data-type="image"] {
  justify-content: flex-start;
}
#slide .picture {
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  max-width: 100%;
  object-fit: contain;
  align-self: stretch;
}
.prompt-only h1 {
  font-size: calc(96px * var(--text-expansion));
  line-height: 1.1;
}
footer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 76px;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
}
footer > div,
nav {

}
footer button {

  min-height: 48px;
  min-width: 52px;
  padding: 9px 17px;
}
#count {
  min-width: 82px;
  text-align: center;
  font-size: 24px;
}
#slide [hidden] {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.list button:disabled {
  opacity: 1;
}
.diagnostic-meta {

  align-items: center;
  gap: 14px;
  margin-top: -8px;
}
.diagnostic-mark {
  width: 34px;
  height: 34px;
  filter: invert(32%) sepia(35%) saturate(800%) hue-rotate(125deg);
}
.diagnostic-instruction {
  font-size: 24px;
  line-height: 1.15;
  color: var(--accent);
}
#slide[data-type="diagnostic"] {

  padding-top: 22px;
}

  line-height: 1;
}
.diagnostic-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  min-height: 0;
}
.diagnostic-section {
  border-left: 4px solid var(--accent);
  padding-left: 12px;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 12px;
  row-gap: 5px;
  align-content: start;
}
.diagnostic-heading {
  margin: 0 0 6px;
  font-size: 25px;
  line-height: 1.05;
  color: var(--accent);
  grid-column: 1 / -1;
}
.diagnostic-item {
  margin: 0;
  font-size: 15px;
  line-height: 1.08;
}
.diagnostic-prompt {
  font-weight: 600;
}
.diagnostic-options {
  margin-top: 2px;
  color: #263d45;
  font-size: 14px;
  line-height: 1.06;
}
.diagnostic-answer {
  margin-top: 2px;
  color: var(--accent);
  font-weight: 700;
}
.review-grid {

  align-content: start;
}
#slide[data-type="review"] {
  justify-content: flex-start;
  gap: 12px;
}
#slide[data-type="review"] h1 {
  font-size: 48px;
}
.review-item {
  display: flex;
  align-items: center;

  font-size: 18px;
}
.review-number {
  min-width: 24px;
  font-weight: 700;
}
.review-item button {

.review-choices {

  flex-wrap: wrap;

.review-choices button {
  font-size: 15px;
  padding: 4px 8px;
  min-height: 32px;
}
.review-paper {
  color: var(--accent);
  font-size: 16px;
}

at does disruption mean?","answer":"A break in normal life.","feedback":"The pandemic caused a break in normal life."},{"id":"word-significant","type":"reveal","prompt":"What does significant mean?","answer":"Very great or very large.","feedback":"The pandemic was a significant event in history."},{"id":"all-words-mix","type":"wordmix","prompt":"Mix a word with an idea. Make a sentence.","pairs":[{"word":"resilient","meaning":"strong again after a difficult time"},{"word":"severity","meaning":"how serious an illness is"},{"word":"droplet","meaning":"a very small drop"},{"word":"vital","meaning":"very important"},{"word":"disruption","meaning":"a break in normal life"},{"word":"significant","meaning":"very great or very large"}],"ideas":["an illness","school closures","online learning","our community"],"frame":"Use because or so. Your sentence must show the word's meaning."},{"id":"weak-strong","type":"compare","prompt":"Which sentence shows the meaning of severity?","columns":[{"label":"A","text":"Severity means serious."},{"label":"B","text":"Vaccines reduced the severity of illness, so fewer people became very sick."}],"hint":"Look for an action and a result."},{"id":"pbd-routine","type":"steps","prompt":"Reading and word check","items":["The teacher chooses pupils with the randomizer.","Read one passage paragraph clearly.","Use one target word in your own sentence."]},{"id":"exit-sentence","type":"writing","prompt":"Write one sentence that shows a word's meaning","task":"Choose one word: resilient, severity, droplet, vital, disruption or significant. Write one sentence about your life or school that shows its meaning.","frame":"Word + action + detail + because / so + result."}]}</script><script>(() => {
  "use strict";
  const deck = JSON.parse(document.getElementById("deck-data").textContent),

    slide = document.getElementById("slide");
  const [w, h] = (deck.viewport || "1366x768").split("x").map(Number);
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  let index = 0;
  const responseLog = new Map();

    hint: false,
    revealed: false,
    step: 0,
    selected: null,
    order: [],
    groups: {},

    const n = document.createElement(tag);
    if (text !== undefined) n.textContent = text;
    if (cls) n.className = cls;

  };

      prompt: source.prompt,
      response: option,

  function draw() {
    const focused = document.activeElement;
    const focusIndex = [...slide.querySelectorAll("button")].indexOf(focused);
      const s = deck.slides[index],

    if (s.stimulus) add("p", s.stimulus, "stimulus");
    if (s.visual && s.type !== "diagnostic") {

      const mark = el("img", undefined, "diagnostic-mark");
      mark.src = s.visual.src;

        row.append(el("span", `${source.id.replace("q-", "")}.`, "review-number"));

          const current = states[sourceIndex].selected;
          const currentIndex = current ? source.options.indexOf(current) : -1;

    }

        section.items.forEach((item) => {

              : "No order selected",

            el(

          const pos = st.order.indexOf(i);
          n.append(
            button(
              `${pos < 0 ? "○" : pos + 1 + "."} ${s.items[i]}`,
              () => {
                st.order =
                  pos < 0 ? [...st.order, i] : st.order.filter((x) => x !== i);
                draw();
              },
              pos >= 0,
            ),
          );
        });
      }
    }
    if (s.type === "sort") {
      const n = add("div", undefined, "list");
      s.items.forEach((item, i) => {
        const row = el("div", undefined, "sort-row"),
          choices = el("div", undefined, "choices");
        row.append(el("span", item.text));
        choices.setAttribute("role", "group");
        choices.setAttribute("aria-label", item.text);
        s.categories.forEach((c) => {
          const selected = st.groups[i] === c;
          const result = st.revealed
            ? c === item.category
              ? "correct"
              : selected
                ? "incorrect"
                : ""
            : "";
          const label =
            result === "correct"
              ? `✓ Correct — ${c}`
              : result === "incorrect"
                ? `✕ Incorrect — ${c}`
                : c;
          choices.append(
            button(
              label,
              () => {
                if (st.revealed) return;
                st.groups[i] = c;
                draw();
              },
              selected,
              result,
            ),
          );
        });
        row.append(choices);
        n.append(row);
      });
    }
    if (s.type === "wordmix") {
      const reference = add("div", undefined, "wordmix-reference");
      s.pairs.forEach((pair) => {
        const selected = st.mix.word === pair.word;
        const row = el("div", undefined, "wordmix-row");
        row.append(
          button(
            pair.word,
            () => {
              st.mix.word = st.mix.word === pair.word ? null : pair.word;
              draw();
            },
            selected,
          ),
          el("span", pair.meaning),
        );
        reference.append(row);
      });
      const builder = add("div", undefined, "wordmix-builder");
      const ideaChoices = el("div", undefined, "wordmix-ideas");
      ideaChoices.setAttribute("role", "group");
      ideaChoices.setAttribute("aria-label", "Ideas");
      s.ideas.forEach((idea) => {
        ideaChoices.append(
          button(
            idea,
            () => {
              st.mix.idea = st.mix.idea === idea ? null : idea;
              draw();
            },
            st.mix.idea === idea,
          ),
        );
      });
      const selection = el(
        "p",
        `${st.mix.word || "Choose a word"} + ${st.mix.idea || "choose an idea"}`,
        "wordmix-selection",
      );
      selection.setAttribute("aria-live", "polite");
      builder.append(ideaChoices, selection, el("p", s.frame, "wordmix-frame"));
    }
    if (st.hint && s.hint && !st.revealed) add("p", s.hint, "hint");
    if (st.revealed) {
      if (["reveal", "choice"].includes(s.type)) add("p", s.answer, "answer");
      if (s.feedback) {
        const f = add("p", s.feedback, "feedback");
        f.setAttribute("role", "status");
      }
    }
    expandContent(s.type);
    const hint = document.getElementById("hint"),
      rev = document.getElementById("reveal");
    hint.hidden = !s.hint;
    hint.disabled = st.revealed;
    hint.textContent = st.hint ? "Hide hint" : "Hint";
    rev.hidden = deck.mode === "answering" || !(
      ["reveal", "choice", "cloze", "gap", "steps", "order", "sort", "diagnostic"].includes(
        s.type,
      ) ||
      (s.type === "writing" && s.frame)
    );
    rev.textContent = s.type === "steps" ? "Next step" : "Reveal";
    rev.disabled =
      s.type === "steps" ? st.step >= s.items.length - 1 : st.revealed;
    document.getElementById("reset").hidden =
      deck.mode !== "answering" && hint.hidden && rev.hidden && s.type !== "wordmix";
    const exportButton = document.getElementById("export-json");
    exportButton.hidden = deck.mode !== "answering" || s.type !== "review";
    exportButton.textContent = deck.mode === "answering" ? `Export JSON (${responseLog.size})` : "Export JSON";
    document.getElementById("prev").disabled = index === 0;
    document.getElementById("next").disabled = index === deck.slides.length - 1;
    document.getElementById("count").textContent =
      `${index + 1} / ${deck.slides.length}`;
    if (focusIndex >= 0) slide.querySelectorAll("button")[focusIndex]?.focus();
    document.getElementById("announcement").textContent =
      `Slide ${index + 1} of ${deck.slides.length}. ${s.prompt}. ` +
      (st.revealed
        ? checkedAnnouncement(s, st)
        : st.hint
          ? s.hint || ""
          : st.selected || "");
  }
  // Enlarge sparse content to use the classroom canvas. Never shrink below
  // the shared projection type scale; oversized content must be split in JSON.
  function expandContent(type) {
    if (type === "image") return;
    const fits = () => {
      const bounds = slide.getBoundingClientRect();
      const ratio = bounds.width / slide.offsetWidth;
      const style = getComputedStyle(slide);
      const top = bounds.top + parseFloat(style.paddingTop) * ratio;
      const bottom = bounds.bottom - parseFloat(style.paddingBottom) * ratio;
      const left = bounds.left + parseFloat(style.paddingLeft) * ratio;
      const right = bounds.right - parseFloat(style.paddingRight) * ratio;
      return [...slide.querySelectorAll("*")].every((node) => {
        const r = node.getBoundingClientRect();
        return (
          (!r.width && !r.height) ||
          (r.top >= top - 1 &&
            r.bottom <= bottom + 1 &&
            r.left >= left - 1 &&
            r.right <= right + 1 &&
            node.scrollWidth <= node.clientWidth + 1)
        );
      });
    };
    let low = 1,
      high = type === "prompt" || type === "reveal" ? 1.4 : 1.25;
    for (let i = 0; i < 8; i++) {
      const mid = (low + high) / 2;
      slide.style.setProperty("--text-expansion", mid);
      if (fits()) low = mid;
      else high = mid;
    }
    slide.style.setProperty("--text-expansion", low.toFixed(3));
  }
  function focusChoice(text) {
    [...slide.querySelectorAll("button")]
      .find((n) => n.textContent === text)
      ?.focus();
  }
  function checkedAnnouncement(s, st) {
    if (["choice", "cloze", "gap"].includes(s.type)) {
      if (!st.selected)
        return `Correct answer: ${s.answer}. ${s.feedback || ""}`;
      return st.selected === s.answer
        ? `Correct. ${s.answer}. ${s.feedback || ""}`
        : `Incorrect. You chose ${st.selected}. Correct answer: ${s.answer}. ${s.feedback || ""}`;
    }
    if (s.type === "sort") {
      const wrong = s.items.filter((item, i) => st.groups[i] !== item.category).length;
      return wrong
        ? `Incorrect. ${wrong} ${wrong === 1 ? "item needs" : "items need"} correction. ${s.feedback || ""}`
        : `Correct. ${s.feedback || ""}`;
    }
    if (s.type === "order") {
      const correct =
        st.order.length === s.items.length &&
        st.order.every((itemIndex, position) => itemIndex === position);
      return `${correct ? "Correct" : "Incorrect"} order. ${s.feedback || ""}`;
    }
    return (s.answer || "") + " " + (s.feedback || "");
  }
  function reveal() {
    const s = deck.slides[index],
      st = states[index];
    if (s.type === "steps") st.step = Math.min(st.step + 1, s.items.length - 1);
    else {
      st.revealed = true;
      st.hint = false;
    }
    draw();
  }
  function move(n) {
    index = Math.max(0, Math.min(deck.slides.length - 1, index + n));
    draw();
  }
  document.getElementById("hint").onclick = () => {
    states[index].hint = !states[index].hint;
    draw();
  };
  document.getElementById("reveal").onclick = reveal;
  document.getElementById("reset").onclick = () => {
    responseLog.delete(deck.slides[index].id);
    states[index] = {
      hint: false,
      revealed: false,
      step: 0,
      selected: null,
      order: [],
      groups: {},
      mix: {},
    };
    draw();
  };
  document.getElementById("prev").onclick = () => move(-1);
  document.getElementById("next").onclick = () => move(1);
  document.getElementById("export-json").onclick = () => {
    const currentSlide = deck.slides[index];
    const payload = {
      schema: "teacher-answering-responses-v1",
      deckTitle: deck.title,
      mode: deck.mode || "teaching",
      exportedAt: new Date().toISOString(),
      responses: [...responseLog.values()].sort((a, b) => a.slideNumber - b.slideNumber),
      unansweredSlideIds: deck.slides
        .filter((slide) => (currentSlide.reviewIds || []).includes(slide.id) && !responseLog.has(slide.id))
        .map((slide) => slide.id),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    const safeTitle = String(deck.title).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    link.download = `${safeTitle || "diagnostic"}-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
    document.getElementById("announcement").textContent = `Exported ${payload.responses.length} recorded responses as JSON. ${payload.unansweredSlideIds.length} response items remain unanswered.`;
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.isContentEditable || e.target.closest("input,textarea,select"))
      return;
    const space = e.code === "Space" || e.key === " ";
    if (space && e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) {
      e.preventDefault();
      if (!e.repeat) document.getElementById("reset").click();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      if (!e.repeat) move(e.key === "ArrowRight" ? 1 : -1);
    } else if (space) {
      // Capture Space even when a choice or navigation button has focus.
      // Enter remains the native way to activate the focused button.
      e.preventDefault();
      const control = document.getElementById("reveal");
      if (!e.repeat && !control.hidden && !control.disabled) control.click();
    }
  });
  function scale() {
    const z = Math.min(innerWidth / w, innerHeight / h);
    stage.style.transform = `scale(${z})`;
    stage.style.left = (innerWidth - w * z) / 2 + "px";
    stage.style.top = (innerHeight - h * z) / 2 + "px";
  }
  addEventListener("resize", scale);
  scale();
  draw();
})();
</script></body></html>
