<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    @page { size: A4 portrait; margin: 13mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ececec; color: #111; font-family: Arial, Helvetica, sans-serif; font-size: 11pt; line-height: 1.35; }
    .page { width: 184mm; min-height: 271mm; margin: 10mm auto; padding: 0; background: #fff; break-after: page; position: relative; }
    .page:last-child { break-after: auto; }
    h1 { margin: 0 0 1.5mm; text-align: center; font-size: 17pt; letter-spacing: .2px; }
    .subtitle { text-align: center; font-weight: 700; font-size: 11.5pt; }
    .marks { float: right; }
    .rule { border: 0; border-top: 1.2px solid #111; margin: 3mm 0 4mm; }
    .meta { display: grid; grid-template-columns: 1.3fr .7fr 1fr; gap: 7mm; font-size: 10.5pt; }
    .line { display: inline-block; min-width: 39mm; height: 5mm; border-bottom: 1px solid #111; vertical-align: bottom; }
    .line.short { min-width: 20mm; }
    .instructions { margin: 4mm 0 3mm; font-size: 10.5pt; }
    .item { margin: 0 0 5mm; break-inside: avoid; }
    .item h2 { margin: 0 0 1.5mm; font-size: 12pt; }
    .stimulus { border: 1px solid #333; padding: 3mm 4mm; margin-bottom: 2mm; }
    .stimulus p { margin: 0 0 1.5mm; }
    .stimulus p:last-child { margin-bottom: 0; }
    .stimulus-title { font-weight: 700; text-align: center; letter-spacing: .3px; }
    .question { margin: 1.5mm 0 1mm; }
    .options { list-style: none; padding: 0; margin: 0 0 0 2mm; }
    .options li { margin: 1.1mm 0; }
    .letter { display: inline-block; width: 7mm; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
    th, td { border: 1px solid #444; padding: 1.6mm 2.5mm; text-align: left; }
    th { background: #f1f1f1; }
    .footer { position: absolute; bottom: 0; left: 0; right: 0; text-align: right; font-size: 9pt; color: #333; }
    @media print { body { background: #fff; } .page { width: auto; min-height: 271mm; margin: 0; } }
  </style>
</head>
<body>
  <main>
{{PAGES}}
  </main>
</body>
</html>
