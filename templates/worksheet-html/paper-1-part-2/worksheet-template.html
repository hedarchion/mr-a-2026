<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    @page { size: A4 portrait; margin: 14mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ececec; color: #111; font-family: Arial, Helvetica, sans-serif; font-size: 11.5pt; line-height: 1.48; }
    .page { width: 182mm; min-height: 269mm; margin: 10mm auto; padding: 0; background: #fff; position: relative; break-after: page; }
    .page:last-child { break-after: auto; }
    h1 { margin: 0 0 1.5mm; text-align: center; font-size: 17pt; letter-spacing: .2px; }
    .subtitle { text-align: center; font-weight: 700; font-size: 11.5pt; }
    .marks { float: right; }
    .rule { border: 0; border-top: 1.2px solid #111; margin: 3mm 0 4mm; }
    .meta { display: grid; grid-template-columns: 1.3fr .7fr 1fr; gap: 7mm; font-size: 10.5pt; }
    .line { display: inline-block; min-width: 38mm; height: 5mm; border-bottom: 1px solid #111; vertical-align: bottom; }
    .line.short { min-width: 20mm; }
    .instructions { margin: 5mm 0 3mm; font-size: 10.8pt; }
    .focus { margin: 0 0 4mm; padding: 2.5mm 3.5mm; border: 1px solid #777; background: #f5f5f5; font-size: 10.3pt; }
    .passage { border: 1.2px solid #222; padding: 5mm 6mm; margin: 0 0 5mm; }
    .passage h2 { margin: 0 0 3mm; text-align: center; font-size: 14pt; }
    .passage p { margin: 0 0 3mm; }
    .passage p:last-child { margin-bottom: 0; }
    .error { font-weight: 700; text-decoration: underline; text-decoration-thickness: 1.2px; text-underline-offset: 2px; }
    .example { margin: 0 0 4mm; padding: 2.5mm 3.5mm; border-left: 3px solid #222; background: #f5f5f5; font-size: 10.8pt; }
    .answers { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11pt; }
    .answers th, .answers td { border: 1px solid #555; padding: 2.6mm 3mm; }
    .answers th { background: #f1f1f1; text-align: center; }
    .answers .number-column { width: 7%; }
    .answers .word-column { width: 43%; }
    .answers td:nth-child(odd) { text-align: center; font-weight: 700; padding-left: 1mm; padding-right: 1mm; }
    .answers td:nth-child(even) { height: 10mm; }
    .footer { position: absolute; bottom: 0; left: 0; right: 0; text-align: right; font-size: 9pt; color: #333; }
    @media print { body { background: #fff; } .page { width: auto; min-height: 269mm; margin: 0; } }
  </style>
</head>
<body>
  <main>
{{PAGE}}
  </main>
</body>
</html>
